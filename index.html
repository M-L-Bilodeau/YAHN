<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YAHN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      body {
        background: linear-gradient(180deg, #ffe5e0 0%, #fff8f0 100%);
        animation: floatClouds 30s ease-in-out infinite;
        overflow-x: hidden;
      }

      @keyframes fadeIn {
        0% {
          opacity: 0;
          transform: translateY(-10px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes floatClouds {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
    </style>
  </head>
  <body class="text-gray-800 flex flex-col items-center justify-center min-h-screen relative font-sans">
    <!-- HALP! link -->
    <div class="absolute top-4 right-4">
      <a
        href="https://988lifeline.org/"
        target="_blank"
        class="text-red-600 hover:text-red-800 font-bold text-lg animate-pulse"
        >HALP!</a
      >
    </div>

    <!-- YAHN Title -->
    <h1
      class="text-6xl md:text-7xl font-bold text-rose-600 mb-8 animate-fade-in"
      style="animation: fadeIn 2s ease-out forwards"
    >
      YAHN
    </h1>

    <!-- Icon Row -->
    <div class="flex gap-12 md:gap-20 text-rose-600">
      <a href="/self.html" class="flex flex-col items-center hover:text-rose-800">
        <i class="fas fa-user text-4xl"></i>
        <span class="mt-2 text-lg">Self</span>
      </a>
      <a href="/group.html" class="flex flex-col items-center hover:text-rose-800">
        <i class="fas fa-users text-4xl"></i>
        <span class="mt-2 text-lg">Others</span>
      </a>
      <a href="/about.html" class="flex flex-col items-center hover:text-rose-800">
        <i class="fas fa-question-circle text-4xl"></i>
        <span class="mt-2 text-lg">About</span>
      </a>
    </div>

    <!-- Donation link -->
    <div class="mt-12">
      <a
        href="#donate"
        class="text-rose-500 hover:text-rose-700 text-base underline"
        >Help others find the way</a
      >
    </div>
  </body>
</html>
