<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YAHN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      body {
        background: radial-gradient(circle at 50% 30%, #ffe9d6, #ffdfba, #ffd9a3);
        background-size: 400% 400%;
        animation: cloudDrift 60s linear infinite;
        overflow-x: hidden;
        position: relative;
      }

      body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: 
          url('https://www.transparenttextures.com/patterns/clouds.png') repeat;
        background-size: 800px;
        opacity: 0.12;
        animation: mistFall 60s linear infinite;
        z-index: 0;
        pointer-events: none;
      }

      @keyframes cloudDrift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      @keyframes mistFall {
        0% { transform: translateY(0); }
        100% { transform: translateY(100%); }
      }

      @keyframes fadeIn {
        0% {
          opacity: 0;
          transform: translateY(-10px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body class="text-gray-800 flex flex-col items-center justify-center min-h-screen relative font-sans">
    <!-- HALP! link -->
    <div class="absolute top-4 right-4 z-10">
      <a
        href="https://988lifeline.org/"
        target="_blank"
        class="text-red-500 hover:text-red-700 font-bold text-lg animate-pulse"
        >HALP!</a
      >
    </div>

    <!-- Donation link -->
    <div class="absolute top-4 left-1/2 transform -translate-x-1/2 z-10">
      <a
        href="#donate"
        class="text-rose-600 hover:text-rose-800 text-sm underline"
        >Help others find the way</a
      >
    </div>

    <!-- YAHN Title -->
    <h1
      class="text-[12rem] font-bold text-gray-800 mb-12 animate-fade-in z-10"
      style="animation: fadeIn 4s ease-out forwards"
    >
      YAHN
    </h1>

    <!-- Icon Row -->
    <div class="flex gap-12 md:gap-20 text-gray-800 z-10">
      <a href="/self.html" class="flex flex-col items-center hover:text-gray-900">
        <i class="fas fa-user text-2xl"></i>
        <span class="mt-1 text-sm">Self</span>
      </a>
      <a href="/group.html" class="flex flex-col items-center hover:text-gray-900">
        <i class="fas fa-users text-2xl"></i>
        <span class="mt-1 text-sm">Others</span>
      </a>
      <a href="/about.html" class="flex flex-col items-center hover:text-gray-900">
        <i class="fas fa-question-circle text-2xl"></i>
        <span class="mt-1 text-sm">About</span>
      </a>
    </div>
  </body>
</html>
